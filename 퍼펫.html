<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퍼펫 — 함께하는 모든 날</title>
<style>
:root{--ink:#343830;--muted:#83877a;--cream:#faf8f2;--line:#e9e8de;--orange:#e78a58;--green:#556f51;--soft:#f3e9dd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Malgun Gothic',system-ui,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}button:disabled{opacity:.5;cursor:default}header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 5vw;background:#fffdf8}.brand{font-size:28px;font-weight:900;display:flex;align-items:center;gap:10px;letter-spacing:-2px}.brand small{font-size:10px;letter-spacing:2px;display:block;color:var(--muted)}.paw{width:38px;height:38px;fill:var(--orange)}.desktopnav{display:flex;gap:32px}.desktopnav button{padding:12px 0;color:var(--muted)}.desktopnav button.active{color:var(--green);font-weight:bold;border-bottom:2px solid var(--green)}.account{background:#eeeede;padding:10px 16px;border-radius:30px}.wrap{max-width:1200px;margin:auto;padding:38px 30px 100px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:bold}h1{font-size:30px;letter-spacing:-1.5px;margin:12px 0}h2{font-size:19px;margin:0 0 18px;letter-spacing:-.5px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.7}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.stack{display:grid;gap:16px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.card{background:#fffefa;border:1px solid var(--line);border-radius:24px;padding:26px}.hero{background:#efeede;position:relative;overflow:hidden;min-height:195px;display:flex;align-items:center;margin:26px 0;gap:25px;padding:28px 36px;border-radius:26px}.hero:after{content:'♡';position:absolute;font-size:190px;right:35px;top:-40px;color:#dfe2ce;transform:rotate(-15deg);pointer-events:none}.portrait{width:120px;height:120px;flex-shrink:0;position:relative;z-index:1}.portrait svg{width:100%;height:100%}.petmeta{position:relative;z-index:1}.petmeta h2{font-size:26px;margin:5px 0 8px}.pill{display:inline-block;border-radius:20px;background:#f2f3e9;padding:6px 10px;font-size:11px;color:var(--green)}.pill.orange{background:#fff0e4;color:#ad6034}.primary{background:var(--green);color:white;padding:12px 19px;border-radius:12px;font-weight:bold}.secondary{border:1px solid var(--line);background:#fffefa;padding:10px 16px;border-radius:12px}.danger{color:#b35546}.small{font-size:12px}.calhead{margin-bottom:20px}.calhead strong{font-size:19px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week{color:var(--muted);text-align:center;font-size:11px;margin-bottom:10px}.day{height:55px;border-radius:13px;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}.day:hover{background:#f4f2e9}.day.selected{background:var(--green);color:white}.day.today:not(.selected){box-shadow:inset 0 0 0 1px var(--orange)}.dot{width:5px;height:5px;background:var(--orange);border-radius:50%;display:block}.event{padding:17px 0;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center}.event:last-child{border:0}.eventicon{width:40px;height:43px;border-radius:12px;background:#faf0e5;display:grid;place-items:center;font-size:19px}.event .body{flex:1;min-width:0}.event p{margin:4px 0 0;font-size:12px;color:var(--muted)}.empty{text-align:center;padding:30px 10px;color:var(--muted);line-height:1.8}.insight{background:#f6e9db;border:0;margin-top:18px}.insight p{margin-bottom:0}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.filters input{flex:1;min-width:180px}.chip{padding:9px 15px;border:1px solid var(--line);border-radius:30px;background:white}.chip.active{background:var(--green);color:white}.searchgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.map{position:relative;min-height:465px;background:#f0eee4;border-radius:24px;overflow:hidden;border:1px solid #e4e2d5}.map svg{position:absolute;width:100%;height:100%;inset:0}.maplabel{position:absolute;left:18px;top:18px;background:#fffdf7e8;padding:10px 15px;border-radius:12px;font-size:12px}.pin{position:absolute;transform:translate(-50%,-50%);border-radius:40px;background:white;border:2px solid white;box-shadow:0 4px 10px #35432a22;padding:9px 12px;font-weight:bold;color:var(--green);white-space:nowrap}.pin.active{background:var(--green);color:white;border-color:var(--green);z-index:2}.facility{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fffefa;text-align:left;width:100%;display:block;margin-bottom:12px}.facility.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.facility p{margin:8px 0 0;font-size:12px;color:var(--muted)}.facilityhead{display:flex;gap:12px}.tile{height:48px;width:48px;flex-shrink:0;background:#edeedc;border-radius:14px;display:grid;place-items:center;font-size:24px}.link{color:var(--green);text-decoration:underline;text-underline-offset:4px}.booking{margin-bottom:14px}.booking .row{flex-wrap:wrap}.booking h3{margin-top:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.petcard{display:flex;gap:22px;align-items:center}.petcard .portrait{width:90px;height:90px}.petcard .body{flex:1}.petcard p{margin:6px 0}.notice{background:#f1f0e6;border-radius:15px;padding:16px;font-size:12px;line-height:1.8;margin-top:22px}dialog{border:1px solid var(--line);border-radius:24px;padding:0;width:540px;max-width:calc(100% - 24px);max-height:90dvh;color:var(--ink);background:#fffefa;box-shadow:0 25px 100px #2223}dialog::backdrop{background:#27302666;backdrop-filter:blur(3px)}.modalhead{position:sticky;top:0;background:#fffefa;padding:22px 24px;border-bottom:1px solid var(--line);z-index:2}.modalhead h2{margin:0}.modalbody{padding:24px}.close{font-size:23px;padding:0 5px}label{display:block;font-size:12px;margin-bottom:8px;font-weight:bold}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #dcded3;background:#fffefb;border-radius:11px;color:var(--ink);min-height:44px}input:focus,select:focus,textarea:focus{outline:2px solid #a7b59a;outline-offset:1px}textarea{resize:vertical}.field{margin-bottom:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{width:100%}.details{display:grid;grid-template-columns:90px 1fr;gap:15px;padding:16px 0;border-bottom:1px solid var(--line);line-height:1.7}.details dt{color:var(--muted)}.details dd{margin:0}.review{background:#f5f3e9;padding:15px;border-radius:12px;line-height:1.8;margin:10px 0}.toast{position:fixed;right:24px;top:24px;width:340px;max-width:calc(100% - 32px);background:var(--ink);color:white;padding:18px 22px;border-radius:16px;z-index:100;box-shadow:0 10px 50px #0002;white-space:pre-line;line-height:1.7}.bottomnav{display:none}footer{text-align:center;color:var(--muted);font-size:11px;padding-top:32px} .sectiontop{margin-bottom:24px}.tinycap{font-size:10px;letter-spacing:1px;color:var(--muted)}
@media(max-width:760px){header{height:72px;padding:0 20px}.brand{font-size:24px}.desktopnav{display:none}.account{font-size:11px;padding:8px 12px}.wrap{padding:28px 18px 110px}h1{font-size:25px}.grid,.searchgrid{grid-template-columns:1fr}.hero{padding:22px;gap:15px;min-height:170px;margin-top:22px}.hero .portrait{width:86px;height:100px}.hero:after{right:-15px}.petmeta h2{font-size:23px}.petmeta p{font-size:12px}.card{padding:21px;border-radius:20px}.day{height:46px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffefaf5;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px 10px max(10px,env(safe-area-inset-bottom));z-index:10;justify-content:space-around}.bottomnav button{display:flex;align-items:center;flex-direction:column;gap:5px;font-size:10px;color:var(--muted);width:25%;padding:5px}.bottomnav button span{font-size:22px}.bottomnav button.active{color:var(--green);font-weight:bold}.map{min-height:330px}.searchgrid{gap:16px}.two{gap:10px}.toast{top:12px;right:16px}.petcard{gap:12px}.petcard .portrait{width:65px;height:65px}.petcard .secondary{padding:8px 10px}.sectiontop{align-items:flex-start}.sectiontop .primary{white-space:nowrap;padding:10px 13px}.filters{gap:7px}.chip{padding:8px 12px;font-size:12px}}
</style></head><body>
<header><div class="brand"><svg class="paw" viewBox="0 0 50 50" aria-hidden="true"><ellipse cx="25" cy="34" rx="14" ry="11"/><ellipse cx="9" cy="20" rx="6" ry="8" transform="rotate(-25 9 20)"/><ellipse cx="20" cy="11" rx="6" ry="8"/><ellipse cx="33" cy="12" rx="6" ry="8"/><ellipse cx="43" cy="23" rx="6" ry="8" transform="rotate(25 43 23)"/></svg><div>퍼펫<small>PERFECT DAYS, WITH PETS</small></div></div><nav class="desktopnav" aria-label="주 메뉴"></nav><button class="account" onclick="navigate('profile')">소미네 집 ↗</button></header>
<main class="wrap" id="app"></main><nav class="bottomnav" aria-label="하단 메뉴"></nav><dialog id="modal"></dialog><div id="announcer" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=localDate(new Date()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),key='perpet-v1';
let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){};
if(!state||!Array.isArray(state.pets)||!state.pets.length)state={pets:[{id:'somi',name:'소미',type:'강아지',breed:'폼피치',weight:'',notes:'포메라니안과 스피치 믹스견'}],events:[{id:'welcome',pet:'somi',title:'소미 건강 체크',date:today,time:'10:00',note:'몸무게와 컨디션을 기록해 주세요.',alarm:'60'}],bookings:[],notifications:[]};
state.notifications ||= []; let page='home',petId=state.pets[0].id,selectedDate=today,month=new Date(new Date().getFullYear(),new Date().getMonth(),1),category='전체',district='연남동',paper=false,facilityId=1;
const facilities=[{id:1,name:'연남 포근 동물병원',type:'동물병원',icon:'✚',distance:'350m',hours:'09:00–20:00 · 일요일 휴무',service:'일반 진료 · 예방접종 · 건강검진',price:'일반 진료 15,000원부터',paper:true,x:34,y:34,rating:'4.9',review:'설명을 차근차근 해주셔서 편안했어요.'},{id:2,name:'온유 동물의료원',type:'동물병원',icon:'✚',distance:'680m',hours:'10:00–21:00 · 수요일 휴무',service:'일반 진료 · 치과 · 영상 검사',price:'일반 진료 20,000원부터',paper:false,x:72,y:58,rating:'4.8',review:'아이 상태를 꼼꼼하게 살펴주셨어요.'},{id:3,name:'보송보송 그루밍',type:'펫 미용실',icon:'✂',distance:'420m',hours:'10:00–19:00 · 월요일 휴무',service:'강아지 미용 · 목욕 · 발톱 관리',price:'목욕 30,000원부터',x:62,y:23,rating:'4.9',review:'소심한 아이도 차분하게 기다려주셨어요.'},{id:4,name:'오후의 꼬리',type:'펫 카페',icon:'☕',distance:'550m',hours:'11:00–21:00 · 매일 운영',service:'반려동물 동반 · 놀이 공간 예약',price:'음료 6,000원부터',x:29,y:73,rating:'4.7',review:'산책 후 함께 쉬기 좋은 공간이에요.'},{id:5,name:'작은 발자국 상점',type:'용품 판매점',icon:'♧',distance:'800m',hours:'11:00–20:00 · 화요일 휴무',service:'사료 · 간식 · 장난감 · 방문 상담',price:'장난감 8,000원부터',x:79,y:82,rating:'4.8',review:'아이에게 맞는 용품을 친절히 골라주셨어요.'}];
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch(e){toast('기록을 저장하지 못했어요. 브라우저 저장 공간과 설정을 확인해 주세요.');return false}}
function toast(message){$('#announcer').innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#announcer').innerHTML='',5500)}
function notify(message){state.notifications.unshift({text:message,date:new Date().toLocaleString('ko-KR')});state.notifications=state.notifications.slice(0,40);save();toast(message)}
function dog(type='강아지'){return `<div class="portrait" role="img" aria-label="${type} 예시 일러스트"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="67" fill="#e3d9c3"/><path d="M25 62Q6 11 49 32L70 48 92 30Q137 14 116 66" fill="${type==='고양이'?'#aaa39a':'#bd8e65'}"/><path d="M28 65Q27 30 70 34Q115 31 115 72L119 95Q109 124 70 125Q27 122 23 94Z" fill="${type==='고양이'?'#d6cfc4':'#f3ddba'}"/><path d="M44 90Q42 71 70 73Q98 73 96 96Q89 116 70 116Q47 112 44 90" fill="#fff3df"/><ellipse cx="49" cy="70" rx="5" ry="6" fill="#42382c"/><ellipse cx="91" cy="70" rx="5" ry="6" fill="#42382c"/><path d="M63 86Q70 80 77 86Q76 94 70 95Q64 94 63 86" fill="#42382c"/><path d="M70 95v5m-10 0q10 10 20 0" fill="none" stroke="#665241" stroke-width="3" stroke-linecap="round"/><ellipse cx="36" cy="88" rx="9" ry="5" fill="#e8ad91"/><ellipse cx="104" cy="88" rx="9" ry="5" fill="#e8ad91"/></svg></div>`}
function currentPet(){return state.pets.find(p=>p.id===petId)||state.pets[0]}
function nav(){const items=[['home','⌂','홈'],['search','⌕','주변 찾기'],['bookings','▤','예약 내역'],['profile','♡','마이페이지']];$('.desktopnav').innerHTML=items.map(([id,i,n])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${n}</button>`).join('');$('.bottomnav').innerHTML=items.map(([id,i,n])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')"><span aria-hidden="true">${i}</span>${n}</button>`).join('')}
function navigate(p){page=p;render();window.scrollTo(0,0)}
function render(){nav();$('#app').innerHTML=({home:home,search:search,bookings:bookings,profile:profile}[page])()+`<footer>작은 발걸음도, 함께하는 모든 날도. &nbsp; 퍼펫 ♡</footer>`}
function petOptions(id){return state.pets.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)}</option>`).join('')}
function home(){let p=currentPet(),events=state.events.filter(e=>e.pet===p.id&&e.date===selectedDate).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="row"><div><div class="eyebrow">OUR LITTLE EVERYDAY</div><h1>함께라서 더 좋은 하루</h1><div class="muted">오늘도 우리 아이의 작은 일상을 챙겨요.</div></div><button class="secondary" onclick="notificationList()" aria-label="알림 내역">♧ 알림 ${state.notifications.length||''}</button></div><section class="hero">${dog(p.type)}<div class="petmeta"><span class="tinycap">MY LITTLE FAMILY</span><h2>${esc(p.name)}의 하루 <span style="color:#b07b54">♡</span></h2><p class="muted">${esc(p.breed||p.type)}${p.weight?' · '+esc(p.weight)+'kg':''}</p><select aria-label="반려동물 선택" style="padding:7px 12px;min-height:34px;width:auto;background:#ffffff80" onchange="petId=this.value;render()">${petOptions(p.id)}</select></div></section><div class="grid"><section class="card"><div class="row calhead"><h2 style="margin:0">우리 아이 캘린더</h2><button class="primary" onclick="eventForm()">＋ 일정 추가</button></div><div class="row calhead"><button class="secondary" aria-label="이전 달" onclick="moveMonth(-1)">‹</button><strong>${month.getFullYear()}년 ${month.getMonth()+1}월</strong><button class="secondary" aria-label="다음 달" onclick="moveMonth(1)">›</button></div><div class="week">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${calendar(p.id)}</div><div class="row small muted" style="margin-top:20px"><span>● 일정이 있는 날</span><button class="link" onclick="selectedDate=today;month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()">오늘로 이동</button></div></section><aside><section class="card"><div class="eyebrow" style="margin-bottom:12px">A DAY TO REMEMBER</div><h2>${Number(selectedDate.slice(5,7))}월 ${Number(selectedDate.slice(8))}일 일정 <span class="pill">${events.length}</span></h2>${events.length?events.map(e=>`<div class="event"><div class="eventicon">◷</div><div class="body"><strong>${esc(e.title)}</strong><p>${esc(e.time)} · ${esc(p.name)}</p></div><button class="link small" onclick="eventForm('${e.id}')">수정</button></div><div class="actions"><button class="small muted" onclick="previewAlarm('${e.id}')">♧ 알림 미리보기</button></div>`).join(''):'<div class="empty">아직 등록된 일정이 없어요.<br>함께할 하루를 기록해 볼까요?</div>'}</section><section class="card insight"><div class="eyebrow">A LITTLE CARE</div><h3 style="margin-top:12px">건강한 일상은 작은 기록부터</h3><p class="small muted">예방접종부터 미용하는 날까지.<br>기억하고 싶은 순간을 달력에 남겨 주세요.</p><button class="link small" onclick="navigate('search')">우리 동네 병원 찾기 ↗</button></section></aside></div>`}
function calendar(id){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),end=new Date(y,m+1,0).getDate();return '<span></span>'.repeat(first)+Array.from({length:end},(_,i)=>{let d=localDate(new Date(y,m,i+1)),has=state.events.some(e=>e.pet===id&&e.date===d);return `<button class="day ${d===selectedDate?'selected':''} ${d===today?'today':''}" onclick="selectedDate='${d}';render()" aria-label="${d}${has?' 일정 있음':''}" aria-pressed="${d===selectedDate}">${i+1}${has?'<i class="dot"></i>':'<i style="height:5px"></i>'}</button>`}).join('')}
function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function openModal(title,body){let m=$('#modal');if(m.open)m.close();m.innerHTML=`<div class="modalhead row"><h2>${title}</h2><button class="close" aria-label="닫기" onclick="document.querySelector('#modal').close()">×</button></div><div class="modalbody">${body}</div>`;m.showModal()}
function eventForm(id){let e=state.events.find(x=>x.id===id)||{pet:petId,date:selectedDate,time:'09:00',alarm:'60'};openModal(id?'일정 수정':'새로운 일정',`<form onsubmit="submitEvent(event,'${id||''}')"><div class="field"><label for="epet">반려동물</label><select id="epet" name="pet">${petOptions(e.pet)}</select></div><div class="field"><label for="etitle">일정 이름</label><input id="etitle" name="title" required maxlength="70" placeholder="예: 예방접종, 미용, 건강검진" value="${esc(e.title)}"></div><div class="two"><div class="field"><label for="edate">날짜</label><input id="edate" type="date" name="date" required value="${e.date}"></div><div class="field"><label for="etime">시간</label><input id="etime" type="time" name="time" required value="${e.time}"></div></div><div class="field"><label for="ealarm">일정 알림</label><select id="ealarm" name="alarm" onchange="document.querySelector('#customAlarm').hidden=this.value!=='custom'">${[['none','알림 없음'],['0','일정 시작 시'],['10','10분 전'],['30','30분 전'],['60','1시간 전'],['180','3시간 전'],['1440','하루 전'],['custom','직접 지정']].map(([v,t])=>`<option value="${v}" ${e.alarm===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="customAlarm" class="two" ${e.alarm==='custom'?'':'hidden'} style="${e.alarm==='custom'?'':'display:none'}"><div class="field"><label for="customValue">얼마 전에</label><input id="customValue" name="customValue" type="number" min="1" max="36500" value="${esc(e.customValue||1)}"></div><div class="field"><label for="customUnit">단위</label><select id="customUnit" name="customUnit">${[['1','분 전'],['60','시간 전'],['1440','일 전']].map(([v,t])=>`<option value="${v}" ${e.customUnit===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label for="enote">메모</label><textarea id="enote" name="note" rows="3" maxlength="1000">${esc(e.note)}</textarea></div><button class="primary full">일정 저장</button>${id?`<button type="button" class="danger full" style="margin-top:15px" onclick="deleteEvent('${id}')">일정 삭제</button>`:''}</form>`);$('#ealarm').onchange=function(){let el=$('#customAlarm');el.hidden=this.value!=='custom';el.style.display=this.value==='custom'?'grid':'none'}}
function submitEvent(ev,id){ev.preventDefault();let data=Object.fromEntries(new FormData(ev.target));data.title=data.title.trim();if(!data.title){toast('일정 이름을 입력해 주세요.');return}let item={...data,id:id||uid()};state.events=id?state.events.map(e=>e.id===id?item:e):[...state.events,item];petId=data.pet;selectedDate=data.date;month=new Date(data.date+'T12:00:00');month.setDate(1);save();$('#modal').close();render();toast('일정을 저장했어요.')}
function deleteEvent(id){if(!confirm('이 일정을 삭제할까요?'))return;state.events=state.events.filter(e=>e.id!==id);save();$('#modal').close();render();toast('일정을 삭제했어요.')}
function previewAlarm(id){let e=state.events.find(x=>x.id===id),p=state.pets.find(p=>p.id===e.pet);if(e.alarm==='none'){toast('알림 없음으로 설정된 일정이에요. 일정 수정에서 알림을 선택해 주세요.');return}let amount=e.alarm==='custom'?`${e.customValue}${{'1':'분','60':'시간','1440':'일'}[e.customUnit]} 전`:e.alarm==='0'?'시작 시':`${Number(e.alarm)>=60?Number(e.alarm)/60+'시간':e.alarm+'분'} 전`;notify(`${p.name} · ${e.title}\n${e.date} ${e.time} · ${amount} 알림`)}
function filtered(){return facilities.filter(f=>(district.trim().includes('연남')||district.trim()==='마포구'||district.trim()==='서울 마포구')&&(category==='전체'||f.type===category)&&(!paper||f.paper))}
function search(){let fs=filtered();return `<div class="eyebrow">NEAR YOUR LITTLE WORLD</div><h1>우리 동네, 함께 갈 곳</h1><div class="muted">아이에게 꼭 맞는 공간을 찾아보세요.</div><form class="filters" onsubmit="event.preventDefault();district=document.querySelector('#district').value;render()"><input id="district" aria-label="동네 검색" value="${esc(district)}" placeholder="동네를 입력해 주세요"><button class="primary">동네 검색</button></form><div class="filters">${['전체','동물병원','펫 미용실','펫 카페','용품 판매점'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}<button class="chip ${paper?'active':''}" aria-pressed="${paper}" onclick="paper=!paper;render()">✈ 출국 서류 발급</button></div><div class="row small muted" style="margin-bottom:15px"><span>${esc(district)} · ${fs.length}곳</span><span>예시 업체 정보 · 실제 예약 전송 없음</span></div><div class="searchgrid"><div class="map" aria-label="연남동 예시 지도"><svg viewBox="0 0 500 470" preserveAspectRatio="none"><rect width="500" height="470" fill="#eeece1"/><path d="M-40 310Q130 300 190 150T410 -40" stroke="#d3dfc4" stroke-width="85" fill="none"/><path d="M-40 310Q130 300 190 150T410 -40" stroke="#e3e9d7" stroke-width="35" fill="none"/><path d="M-10 70L530 390M-10 200L500 510M80 -10L450 480M500 80L-20 430M480 -20L-20 300" stroke="#fffdf7" stroke-width="18" fill="none"/><path d="M-10 70L530 390M-10 200L500 510M80 -10L450 480M500 80L-20 430M480 -20L-20 300" stroke="#dfddd0" stroke-width="1" fill="none"/><text x="45" y="250" fill="#8d9f7c" font-size="13" transform="rotate(-45 45 250)">경의선숲길</text><text x="315" y="180" fill="#a2a18f" font-size="16">연남동</text><text x="40" y="440" fill="#9b9c90" font-size="12">홍대입구역</text></svg><div class="maplabel">⌖ 서울 마포구 연남동</div>${fs.map(f=>`<button class="pin ${facilityId===f.id?'active':''}" style="left:${f.x}%;top:${f.y}%" onclick="selectFacility(${f.id})" aria-label="${esc(f.name)} 선택">${f.icon} ${f.id}</button>`).join('')}</div><div id="facilityList">${fs.length?fs.map(f=>`<div class="facility ${facilityId===f.id?'active':''}" id="facility-${f.id}"><button class="facilityhead" style="text-align:left;width:100%" onclick="selectFacility(${f.id})"><span class="tile">${f.icon}</span><span><h3>${f.name}</h3><span class="small muted">${f.type} · ${f.distance} &nbsp; <span style="color:#b78542">★ ${f.rating}</span></span></span></button><p>${f.hours}</p>${f.type==='동물병원'?`<p><span class="pill ${f.paper?'orange':''}">✈ 해외 출국 서류 ${f.paper?'발급 가능':'발급 불가'}</span></p>`:''}<div class="row" style="margin-top:14px"><span class="small muted">${f.price}</span><button class="link small" onclick="detail(${f.id})">자세히 보기 ↗</button></div></div>`).join(''):'<div class="card empty">이 조건에 맞는 시설이 없어요.<br>연남동 또는 다른 업종으로 찾아보세요.</div>'}</div></div>`}
function selectFacility(id){facilityId=id;render();let el=$('#facility-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function detail(id){const f=facilities.find(x=>x.id===id);openModal(f.name,`<div class="row"><span class="pill">${f.type} · ${f.distance}</span><span style="color:#b78542">★ ${f.rating}</span></div><dl>${[['위치','서울 마포구 연남동'],['영업시간',f.hours],['진료·서비스',f.service],['가격',f.price],...(f.type==='동물병원'?[['출국 서류',f.paper?'발급 가능':'발급 불가']]:[])].map(([a,b])=>`<div class="details"><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl><h3>이용 후기</h3><div class="review">★★★★★<br>“${f.review}”<div class="small muted">동네 보호자 · 예시 후기</div></div><div class="notice">예시 업체 정보이며 실제 예약은 전송되지 않습니다.<br>전화번호: 02-0000-0000 (예시 번호)</div><div class="actions"><button class="primary" style="flex:1" onclick="bookingForm(${id})">예약</button><a class="secondary" style="text-decoration:none" href="tel:0200000000" aria-label="예시 번호 전화 연결">☎ 전화</a></div>`)}
const slots=['09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];
function bookingForm(fid,id){let f=facilities.find(f=>f.id===fid),b=state.bookings.find(b=>b.id===id)||{pet:petId,date:today,time:'',purpose:''};openModal(id?'예약 시간 변경':f.name+' 예약',`<form onsubmit="submitBooking(event,${fid},'${id||''}')"><div class="field"><label for="bpet">방문할 반려동물</label><select id="bpet" name="pet">${petOptions(b.pet)}</select></div><div class="field"><label for="purpose">방문 목적</label><input id="purpose" required name="purpose" maxlength="100" value="${esc(b.purpose)}" placeholder="예: 예방접종, 목욕, 방문 상담"></div><div class="two"><div class="field"><label for="bdate">방문 날짜</label><input id="bdate" type="date" name="date" required min="${today}" value="${b.date<today?today:b.date}" onchange="updateSlots('${id||''}',${fid})"></div><div class="field"><label for="btime">가능한 시간</label><select name="time" id="btime" required></select></div></div><div class="notice">업체 승인 후 예약이 확정됩니다.<br>예시 업체이며 실제 방문 예약은 전송되지 않습니다.</div><div class="actions"><button class="primary" style="flex:1">${id?'변경 신청':'예약'}</button><a class="secondary" style="text-decoration:none" href="tel:0200000000">☎ 전화</a></div><p class="small muted">02-0000-0000 · 예시 번호</p></form>`);updateSlots(id||'',fid,b.time)}
function updateSlots(id,fid,selected=''){let date=$('#bdate').value;$('#btime').innerHTML='<option value="">시간 선택</option>'+slots.map(t=>{let past=date===today&&t<=new Date().toTimeString().slice(0,5),occupied=state.bookings.some(b=>b.id!==id&&b.facility===fid&&b.date===date&&b.time===t&&b.status!=='취소');return `<option ${past||occupied?'disabled':''} value="${t}" ${selected===t?'selected':''}>${t}${occupied?' (예약 마감)':past?' (마감)':''}</option>`}).join('')}
function submitBooking(ev,fid,id){ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target));d.purpose=d.purpose.trim();if(!d.purpose){toast('방문 목적을 입력해 주세요.');return}if(d.date<today||!slots.includes(d.time)||(d.date===today&&d.time<=new Date().toTimeString().slice(0,5))){toast('예약 가능한 날짜와 시간을 선택해 주세요.');return}if(state.bookings.some(b=>b.id!==id&&b.facility===fid&&b.date===d.date&&b.time===d.time&&b.status!=='취소')){toast('이미 예약된 시간이에요. 다른 시간을 선택해 주세요.');return}let b={...d,id:id||uid(),facility:fid,status:'예약 승인 대기중',approveAt:Date.now()+4500};state.bookings=id?state.bookings.map(x=>x.id===id?b:x):[b,...state.bookings];save();$('#modal').close();page='bookings';render();toast('예약 승인 대기중\n업체가 승인하면 확정 예약으로 변경됩니다.')}
function bookings(){return `<div class="eyebrow">PLANS FOR HAPPY DAYS</div><div class="row sectiontop"><div><h1>우리 아이 예약 내역</h1><div class="muted">다가오는 만남을 한눈에 확인해요.</div></div><button class="secondary" onclick="navigate('search')">＋ 새 예약</button></div>${state.bookings.length?state.bookings.map(b=>{let f=facilities.find(f=>f.id===b.facility),p=state.pets.find(p=>p.id===b.pet);return `<section class="card booking"><div class="row"><span class="pill">${f.type}</span><button class="pill ${b.status==='예약 승인 대기중'?'orange':''}" disabled>${b.status}</button></div><h3>${f.name}</h3><p>${esc(b.date)} · ${esc(b.time)}<br><span class="muted small">${esc(p?.name||'반려동물')} · ${esc(b.purpose)}</span></p>${b.status==='예약 승인 대기중'?'<p class="small muted">업체가 승인하면 확정 예약으로 변경됩니다.</p>':''}${b.status!=='취소'?`<div class="actions"><button class="secondary" onclick="bookingForm(${f.id},'${b.id}')">시간 변경</button><button class="secondary danger" onclick="cancelBooking('${b.id}')">예약 취소</button></div>`:''}</section>`}).join(''):'<div class="card empty">아직 예약한 일정이 없어요.<br><button class="link" onclick="navigate(\'search\')">우리 동네 시설 둘러보기 ↗</button></div>'}`}
function cancelBooking(id){if(!confirm('예약을 취소할까요?'))return;let b=state.bookings.find(b=>b.id===id);b.status='취소';delete b.approveAt;save();render();notify('예약이 취소되었어요.')}
setInterval(()=>{let changed=false;for(let b of state.bookings){if(b.status==='예약 승인 대기중'&&b.approveAt<=Date.now()){b.status='예약 확정';delete b.approveAt;changed=true;notify(`예약 확정\n${facilities.find(f=>f.id===b.facility).name} · ${b.date} ${b.time}`)}}if(changed){save();render()}},600);
function profile(){return `<div class="eyebrow">MY LITTLE FAMILY</div><div class="row sectiontop"><div><h1>우리 가족 이야기</h1><div class="muted">소중한 아이들의 정보를 기록해요.</div></div><button class="primary" onclick="petForm()">＋ 반려동물 추가</button></div><div class="stack">${state.pets.map(p=>`<section class="card petcard">${dog(p.type)}<div class="body"><h2 style="margin-bottom:8px">${esc(p.name)}</h2><p class="small muted">${esc(p.type)} · ${esc(p.breed||'품종 미입력')}${p.weight?' · '+esc(p.weight)+'kg':''}</p><p class="small">${esc(p.notes)}</p></div><button class="secondary" onclick="petForm('${p.id}')">수정</button></section>`).join('')}</div><div class="notice">이 브라우저에 기록을 보관하고 있어요.<br>같은 파일을 같은 브라우저에서 열어 주세요. 브라우저 데이터를 삭제하면 기록도 지워질 수 있어요.</div><section class="card" style="margin-top:18px"><h3>기록 보관함</h3><p class="muted small">소중한 기록을 파일로 내려받아 따로 보관할 수 있어요.</p><button class="secondary" onclick="exportData()">기록 백업 받기 ↓</button></section>`}
function petForm(id){let p=state.pets.find(p=>p.id===id)||{type:'강아지'};openModal(id?'반려동물 프로필 수정':'새 가족 등록',`<form onsubmit="submitPet(event,'${id||''}')"><div class="field"><label for="pname">이름</label><input id="pname" name="name" maxlength="30" required value="${esc(p.name)}"></div><div class="two"><div class="field"><label for="ptype">반려동물 구분</label><select id="ptype" name="type"><option ${p.type==='강아지'?'selected':''}>강아지</option><option ${p.type==='고양이'?'selected':''}>고양이</option></select></div><div class="field"><label for="pweight">몸무게 (kg)</label><input id="pweight" name="weight" type="number" min="0.01" max="150" step="0.01" value="${esc(p.weight)}"></div></div><div class="field"><label for="pbreed">견종 · 묘종</label><input id="pbreed" name="breed" maxlength="80" value="${esc(p.breed)}" placeholder="예: 폼피치"></div><div class="field"><label for="pnotes">특이사항</label><textarea id="pnotes" name="notes" rows="3" maxlength="1000" placeholder="알레르기, 성격, 돌봄 시 참고할 점">${esc(p.notes)}</textarea></div><button class="primary full">프로필 저장</button></form>`)}
function submitPet(ev,id){ev.preventDefault();let p=Object.fromEntries(new FormData(ev.target));p.name=p.name.trim();if(!p.name){toast('이름을 입력해 주세요.');return}p.id=id||uid();state.pets=id?state.pets.map(x=>x.id===id?p:x):[...state.pets,p];save();$('#modal').close();render();toast('가족 정보를 저장했어요.')}
function notificationList(){openModal('우리 아이 알림',state.notifications.length?state.notifications.map(n=>`<div class="event"><div class="body"><p style="white-space:pre-line;color:var(--ink)">${esc(n.text)}</p><p>${esc(n.date)}</p></div></div>`).join(''):'<div class="empty">아직 도착한 알림이 없어요.<br>일정에서 알림 미리보기를 확인해 보세요.</div>')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='퍼펫_기록_'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
save();render();
</script></body></html>
