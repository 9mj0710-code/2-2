<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퍼펫 · 함께하는 매일</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#303d35;font:15px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:0;border-radius:12px;padding:11px 17px;background:#edf1e9;color:#304c3b}button.primary{background:#345e48;color:white}button:hover{filter:brightness(.96)}header{padding:22px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7df;background:#fffdf9}.brand{font-size:27px;font-weight:900;color:#345e48}.paw{display:inline-block;width:30px;height:28px;position:relative;margin-right:10px}.paw:after{content:'●';font-size:29px;position:absolute;left:6px;top:0}.paw:before{content:'•••';letter-spacing:1px;position:absolute;top:-12px;left:0;font-size:22px}main{max-width:1150px;margin:auto;padding:35px 24px 120px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:20px;margin:0 0 16px}h3{margin:0 0 6px}.muted,small{color:#7a8279}.eyebrow{font-size:12px;letter-spacing:2px;color:#82917f;font-weight:700}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}.card{background:#fff;border:1px solid #e6e8df;border-radius:24px;padding:24px;margin-top:22px}.hero{background:#e7edde;border:0}.avatar{width:68px;height:68px;object-fit:cover;border-radius:22px;background:#f4e5cd;display:grid;place-items:center;font-size:38px}.pet{border:1px solid #ddd;background:white;display:flex;gap:10px;align-items:center}.active{outline:2px solid #527455;background:#eff4e9}.pill{display:inline-block;background:#edf2e8;padding:4px 10px;border-radius:20px;font-size:12px;color:#47674f}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{min-height:54px;padding:7px 1px;background:transparent}.day.selected{background:#345e48;color:white}.dot{display:block;margin:auto;background:#dba76b;width:5px;height:5px;border-radius:50%}.week{color:#92998f;font-size:12px;padding:10px 0}.event{border-top:1px solid #eee;padding:18px 0}.event:last-child{padding-bottom:0}nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;display:flex;box-shadow:0 6px 40px #263e3520;border:1px solid #e1e6da;border-radius:20px;padding:7px;z-index:5;max-width:96vw;width:540px}nav button{flex:1;background:white;padding:12px 4px}nav button.on{background:#e9f0e3;font-weight:bold}label{display:block;margin:13px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d9dfd3;border-radius:10px;background:white;color:#303d35}input[type=checkbox]{width:auto}dialog{border:0;border-radius:24px;padding:25px;width:520px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 20px 90px #0003}dialog::backdrop{background:#1e34296b}dialog .close{float:right}a{color:#345e48}.map{height:330px;border-radius:18px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 68px,#fff 68px 80px),repeating-linear-gradient(0deg,#e8ecdf 0 60px,#fff 60px 74px)}.map:before{content:'경의선 숲길';position:absolute;background:#c6dab8;width:130%;transform:rotate(-22deg);height:48px;top:140px;left:-40px;text-align:center;color:#68845e;padding:10px}.pin{position:absolute;border-radius:50%;padding:8px 12px;background:#345e48;color:white;box-shadow:0 3px 8px #0002}.pin.active{background:#cb8550;outline:3px solid white}.facility{cursor:pointer}.empty{text-align:center;padding:35px;color:#858e80}#notice{position:fixed;top:16px;right:16px;max-width:min(420px,92vw);padding:18px;background:#345e48;color:white;border-radius:15px;box-shadow:0 5px 25px #0002;z-index:30;display:none}footer{margin-top:25px;font-size:12px;color:#899080}@media(max-width:700px){header{padding:16px 20px}main{padding:24px 16px 110px}.grid{grid-template-columns:1fr;gap:0}h1{font-size:25px}.card{padding:19px;border-radius:20px}nav{bottom:9px;width:95%}.day{min-height:45px}.row>*{min-width:0}header small{font-size:11px}}
</style><header><div class="brand"><span class="paw"></span>퍼펫</div><small>너와 나의 건강한 하루 🌿</small></header><main id="app"></main><nav id="nav"></nav><dialog id="modal"></dialog><div id="notice" role="status" aria-live="polite"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);let state;try{state=JSON.parse(localStorage.getItem('purpet_plan_v1'))}catch{}state ||= {pets:[{id:'somi',name:'소미',type:'강아지',breed:'폼피치(포메라니안과 스피치 믹스견)',weight:'4.2',note:'예시: 닭고기에 민감해요.',photo:''}],events:[{id:'e1',pet:'somi',title:'예방접종 상담',date:today(),time:'14:00',note:'접종 기록 챙기기',remind:'60'}],bookings:[]};let page=0,pet=state.pets[0].id,date=today(),month=date.slice(0,7),area='연남동',category='전체',docs=false,chosen=null;const facilities=[['연남 포근 동물병원','동물병원','0.3km','일반진료 · 예방접종 · 건강검진','09:00–19:00 · 일요일 휴무','진료 20,000원부터',true,22,24,'친절하게 설명해 주셔서 안심했어요.'],['숲길 동물의료원','동물병원','0.7km','일반진료 · 치과 · 영상검사','10:00–20:00 · 수요일 휴무','검진 50,000원부터',false,66,22,'차분한 분위기에서 진료받았어요.'],['몽글 펫살롱','펫 미용실','0.4km','목욕 · 부분미용 · 전체미용','10:00–19:00 · 월요일 휴무','목욕 30,000원부터',false,43,60,'아이 속도에 맞춰 천천히 해주셨어요.'],['꼬리정원','펫 카페','0.6km','동반 입장 · 음료 · 실내 놀이','11:00–21:00 · 연중무휴','음료 6,000원부터',false,76,70,'산책 후 쉬어가기 편안해요.'],['소소 펫마켓','반려동물 용품 판매점','0.5km','사료 · 장난감 · 산책용품','10:00–20:00 · 연중무휴','장난감 8,000원부터',false,15,76,'용품을 비교해 보기 좋았어요.']].map((a,i)=>({id:i,name:a[0],type:a[1],distance:a[2],service:a[3],hours:a[4],price:a[5],docs:a[6],x:a[7],y:a[8],review:a[9],phone:'02-0000-000'+i,address:`서울 마포구 연남동 숲길 ${12+i*8} (가상 주소)`}));
function save(){try{localStorage.setItem('purpet_plan_v1',JSON.stringify(state))}catch{toast('저장 공간을 사용할 수 없습니다. 브라우저의 저장 설정을 확인해 주세요.')}}function toast(t){$('#notice').textContent=t;$('#notice').style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>$('#notice').style.display='none',6500)}function pname(id){return state.pets.find(p=>p.id===id)?.name||''}function avatar(p){return p.photo?`<img class="avatar" src="${esc(p.photo)}" alt="${esc(p.name)} 사진">`:`<span class="avatar" role="img" aria-label="${p.type} 예시 그림">${p.type==='고양이'?'🐱':'🐶'}</span>`}function open(html){$('#modal').innerHTML=`<button class="close" onclick="this.closest('dialog').close()" aria-label="닫기">✕</button>${html}`;if(!$('#modal').open)$('#modal').showModal()}function petOptions(v){return state.pets.map(p=>`<option value="${p.id}" ${v===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}function render(){ $('#nav').innerHTML=['⌂ 홈','⌕ 주변 찾기','▣ 예약 내역','♡ 마이페이지'].map((n,i)=>`<button class="${page===i?'on':''}" onclick="page=${i};render()">${n}</button>`).join('');[home,near,bookings,profile][page]() }
function home(){let p=state.pets.find(p=>p.id===pet),d=new Date(month+'-01T12:00:00'),count=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();$('#app').innerHTML=`<div class="eyebrow">EVERY DAY, TOGETHER</div><h1>오늘도 함께, 건강하게</h1><p class="muted">작은 기록으로 채우는 우리 아이의 행복한 일상</p><div class="row">${state.pets.map(p=>`<button class="pet ${p.id===pet?'active':''}" onclick="pet='${p.id}';render()">${avatar(p)}<b>${esc(p.name)}</b></button>`).join('')}</div><div class="card hero row between"><div><span class="pill">우리 아이의 하루</span><h2 style="margin:10px 0 0">${esc(p.name)}의 일정을 챙겨주세요</h2><small>함께하는 모든 순간이 소중하니까요.</small></div><button class="primary" onclick="eventForm()">＋ 일정 추가</button></div><div class="grid"><section class="card"><div class="row between"><h2>${d.getFullYear()}년 ${d.getMonth()+1}월</h2><div><button onclick="shift(-1)" aria-label="이전 달">‹</button> <button onclick="shift(1)" aria-label="다음 달">›</button></div></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="week">${x}</div>`).join('')}${'<span></span>'.repeat(d.getDay())}${Array.from({length:count},(_,i)=>{let key=month+'-'+String(i+1).padStart(2,'0');return `<button class="day ${date===key?'selected':''}" onclick="date='${key}';render()">${i+1}${state.events.some(e=>e.pet===pet&&e.date===key)?'<i class="dot"></i>':''}</button>`}).join('')}</div></section><section class="card"><span class="eyebrow">DAILY PLAN</span><h2>${date.replaceAll('-','. ')} 일정</h2>${state.events.filter(e=>e.pet===pet&&e.date===date).sort((a,b)=>a.time.localeCompare(b.time)).map(e=>`<div class="event"><small>${esc(e.time)} · ${esc(pname(e.pet))}</small><h3>${esc(e.title)}</h3><p class="muted">${esc(e.note)}</p><small>알림: ${esc(e.remind)}분 전</small><div class="row"><button onclick="preview('${e.id}')">알림 미리보기</button><button onclick="eventForm('${e.id}')">수정</button><button onclick="removeEvent('${e.id}')">삭제</button></div></div>`).join('')||'<div class="empty">여유로운 하루예요 🌱<br>새로운 일정을 추가해 보세요.</div>'}</section></div>`}function shift(n){let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+n);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}function preview(id){let e=state.events.find(e=>e.id===id);toast(`${pname(e.pet)} · ${e.title} | ${e.date} ${e.time} · ${e.remind}분 전 알림 미리보기`)}function removeEvent(id){if(confirm('이 일정을 삭제할까요?')){state.events=state.events.filter(e=>e.id!==id);save();render()}}function eventForm(id){let e=state.events.find(e=>e.id===id)||{pet,date,time:'10:00',remind:'60'};open(`<h2>일정 ${id?'수정':'추가'}</h2><form id="ef"><label>반려동물<select name="pet">${petOptions(e.pet)}</select></label><label>일정 제목<input name="title" required value="${esc(e.title)}" placeholder="예방접종, 진료, 복약, 미용"></label><label>날짜<input name="date" type="date" required value="${e.date}"></label><label>시간<input name="time" type="time" required value="${e.time}"></label><label>메모<textarea name="note">${esc(e.note)}</textarea></label><label>알림 시점<select onchange="document.getElementById('minutes').value=this.value"><option value="${e.remind}">현재: ${e.remind}분 전</option value="10">10분 전</option><option value="60">1시간 전</option><option value="180">3시간 전</option><option value="1440">하루 전</option></select></label><label>직접 지정 (분 전)<input id="minutes" name="remind" type="number" min="0" required value="${e.remind}"></label><button class="primary">저장</button></form>`);$('#ef').onsubmit=x=>{x.preventDefault();let v=Object.fromEntries(new FormData(x.target));if(!v.title.trim())return toast('일정 제목을 입력해 주세요.');v.id=id||uid();state.events=state.events.filter(z=>z.id!==v.id);state.events.push(v);pet=v.pet;date=v.date;month=date.slice(0,7);save();$('#modal').close();render()}}
function profile(){$('#app').innerHTML=`<div class="eyebrow">MY FAMILY</div><h1>우리 가족을 소개해요</h1><p class="muted">소미 보호자님, 반가워요 · 예시 계정</p><button class="primary" onclick="petForm()">＋ 반려동물 추가</button><div class="grid">${state.pets.map(p=>`<div class="card"><div class="row">${avatar(p)}<div><h2>${esc(p.name)}</h2><small>${esc(p.type)} · ${esc(p.breed)}</small></div></div><p>몸무게 ${esc(p.weight)||'미입력'} kg</p><p>${esc(p.note)||'특이사항 없음'}</p><button onclick="petForm('${p.id}')">프로필 수정</button></div>`).join('')}</div><footer>소미의 초기 몸무게와 특이사항은 예시 값입니다.<br>기록은 같은 기기·같은 브라우저에 저장됩니다. 브라우저 데이터 삭제, 비공개 모드, 파일 위치 및 브라우저 정책 변경 시 사라질 수 있습니다. 기기 간 동기화와 서버 백업은 지원하지 않습니다.<br>일정 알림은 사이트 안에서 미리보기로 확인하며 실제 휴대폰 알림은 전송하지 않습니다.</footer>`}function petForm(id){let p=state.pets.find(p=>p.id===id)||{type:'강아지'};open(`<h2>반려동물 ${id?'수정':'추가'}</h2><form id="pf"><label>사진<input type="file" id="photo" accept="image/*"></label><label>이름<input name="name" value="${esc(p.name)}" required></label><label>구분<select name="type"><option ${p.type==='강아지'?'selected':''}>강아지</option><option ${p.type==='고양이'?'selected':''}>고양이</option></select></label><label>견종·묘종<input name="breed" value="${esc(p.breed)}"></label><label>몸무게 (kg)<input name="weight" type="number" min="0.01" step="0.01" value="${esc(p.weight)}"></label><label>특이사항<textarea name="note">${esc(p.note)}</textarea></label><button class="primary">저장</button></form>`);$('#pf').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(!v.name.trim())return toast('이름을 입력해 주세요.');v.id=id||uid();v.photo=p.photo||'';let f=$('#photo').files[0];if(f){try{v.photo=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,400/im.width);c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}catch{return toast('사진을 읽을 수 없습니다. 다른 이미지를 선택해 주세요.')}}let index=state.pets.findIndex(p=>p.id===v.id);if(index<0)state.pets.push(v);else state.pets[index]=v;save();$('#modal').close();render()}}
function results(){return facilities.filter(f=>['연남동','서울 마포구 연남동','마포구 연남동'].includes(area.trim())&&(category==='전체'||f.type===category)&&(!docs||f.type==='동물병원'&&f.docs))}function near(){let fs=results();$('#app').innerHTML=`<div class="eyebrow">AROUND YOUR PET</div><h1>우리 동네, 반려생활</h1><p class="muted">가까운 곳에서 만나는 따뜻한 돌봄</p><div class="card"><form id="search" class="row"><input aria-label="동네" name="area" style="flex:2;min-width:130px" value="${esc(area)}"><select aria-label="업종" name="category" style="flex:1;min-width:150px">${['전체','동물병원','펫 미용실','펫 카페','반려동물 용품 판매점'].map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select><button class="primary">검색</button></form><label><input type="checkbox" ${docs?'checked':''} onchange="docs=this.checked;render()"> 해외 출국 서류 발급 가능한 병원만</label><small>예시 업체 정보 · 연남동의 가상 위치, 가격 및 후기입니다.</small></div><div class="grid"><div class="card"><h2>연남동 예시 지도</h2><div class="map">${fs.map(f=>`<button aria-label="${f.name} 위치" class="pin ${chosen===f.id?'active':''}" style="left:${f.x}%;top:${f.y}%" onclick="selectFacility(${f.id})">${f.id+1}</button>`).join('')}</div><small>실제 지도·위치 및 실시간 거리가 아닙니다.</small></div><div><p>${fs.length}개의 장소</p>${fs.map(f=>`<section id="facility-${f.id}" class="card facility ${chosen===f.id?'active':''}" onclick="chosen=${f.id};render()"><span class="pill">${f.type} · ${f.distance}</span><h2 style="margin:12px 0 3px">${f.id+1}. ${f.name}</h2><small>${f.service}<br>${f.hours}<br>${f.price}<br>★ 4.8 · “${f.review}”<br>예시 전화 ${f.phone}</small>${f.type==='동물병원'?`<p class="pill">출국 서류 ${f.docs?'발급 가능':'발급 불가'}</p>`:''}<p><button onclick="event.stopPropagation();detail(${f.id})">상세 정보 · 예약 →</button></p></section>`).join('')||'<div class="card empty">검색 결과가 없습니다.<br>연남동으로 검색하거나 필터를 변경해 주세요.</div>'}</div></div>`;$('#search').onsubmit=e=>{e.preventDefault();let v=new FormData(e.target);area=v.get('area');category=v.get('category');chosen=null;render()}}function selectFacility(id){chosen=id;render();$('#facility-'+id)?.scrollIntoView({behavior:'smooth',block:'nearest'})}function detail(id){chosen=id;let f=facilities[id];render();open(`<span class="pill">예시 업체 정보</span><h2>${f.name}</h2><p>${f.address} · ${f.distance}</p><p>${f.service}</p><p>영업시간: ${f.hours}<br>가격: ${f.price}</p>${f.type==='동물병원'?`<p class="pill">해외 출국 서류 ${f.docs?'발급 가능':'발급 불가'}</p>`:''}<h3>후기 ★ 4.8</h3><p>“${f.review}”</p><small>가상 후기와 가격이며 실제 서류 발급은 제공하지 않습니다.</small><p><a href="tel:${f.phone}">☎ 전화 연결 ${f.phone}</a><br><small>실제 업체와 무관한 예시 번호</small></p><button class="primary" onclick="bookingForm(${id})">예약</button>`)}
function available(f){return Array.from({length:14},(_,i)=>{let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+i+1);return {d,key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}}).filter(x=>!((f.id===0&&x.d.getDay()===0)||(f.id===1&&x.d.getDay()===3)||(f.id===2&&x.d.getDay()===1))).map(x=>x.key)}function bookingForm(fid,id){let f=facilities[fid],b=state.bookings.find(x=>x.id===id)||{},dates=available(f);open(`<h2>${id?'예약 시간 변경':'방문 예약'}</h2><p>${f.name}</p><form id="bf" novalidate><label>반려동물 *<select name="pet"><option value="">선택해 주세요</option>${petOptions(b.pet)}</select></label><label>방문 목적 *<input name="purpose" value="${esc(b.purpose)}" placeholder="${f.service}"></label><label>가능한 날짜 *<select name="date"><option value="">선택해 주세요</option>${dates.map(d=>`<option ${d===b.date?'selected':''}>${d}</option>`).join('')}</select></label><label>가능한 시간 *<select name="time"><option value="">선택해 주세요</option>${['11:00','14:00','16:00','18:00'].map(t=>`<option ${t===b.time?'selected':''}>${t}</option>`).join('')}</select></label><p id="error" role="alert" style="color:#a34e37"></p><button class="primary">${id?'변경 신청':'예약'}</button></form><p><a href="tel:${f.phone}">☎ 전화 연결 ${f.phone}</a><br><small>실제 업체와 무관한 예시 번호</small></p><small>예시 업체 정보 · 예약은 실제 업체에 전송되지 않으며 잠시 뒤 자동으로 확정됩니다. 실제 이용 권리는 제공하지 않습니다.</small>`);$('#bf').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),missing=[['pet','반려동물'],['purpose','방문 목적'],['date','날짜'],['time','시간']].filter(([k])=>!v[k].trim()).map(x=>x[1]);if(missing.length){$('#error').textContent=missing.join(', ')+'을(를) 선택 또는 입력해 주세요.';return}Object.assign(v,{id:id||uid(),fid,status:'예약 승인 대기중',due:Date.now()+4000});state.bookings=state.bookings.filter(x=>x.id!==v.id);state.bookings.push(v);save();page=2;render();bookingStatus(v.id)}}function bookingStatus(id){let b=state.bookings.find(x=>x.id===id);open(`<h2>${facilities[b.fid].name}</h2><p>${esc(pname(b.pet))} · ${esc(b.purpose)}</p><p>${b.date} ${b.time}</p><button disabled class="primary" id="statusbtn" data-booking="${id}">${b.status}</button><p id="statusinfo">${b.status==='예약 승인 대기중'?'업체가 승인하면 확정 예약으로 변경됩니다.':'예약이 확정되었습니다.'}</p><small>실제 업체에 전송되지 않는 자동 승인입니다.</small>`)}function bookings(){$('#app').innerHTML=`<div class="eyebrow">YOUR RESERVATIONS</div><h1>기다려지는 만남</h1><p class="muted">우리 아이의 예약을 한눈에 확인하세요.</p>${state.bookings.slice().reverse().map(b=>`<section class="card"><div class="row between"><h2>${facilities[b.fid].name}</h2><span class="pill">${b.status}</span></div><p>${esc(pname(b.pet))} · ${esc(b.purpose)}<br>${b.date} ${b.time}</p>${b.status==='예약 승인 대기중'?'<p>업체가 승인하면 확정 예약으로 변경됩니다.</p>':''}${b.status!=='예약 취소'?`<div class="row"><button onclick="bookingForm(${b.fid},'${b.id}')">시간 변경</button><button onclick="cancelBooking('${b.id}')">예약 취소</button></div>`:'<small>취소된 예약입니다.</small>'}</section>`).join('')||'<div class="card empty">아직 예약이 없어요.<br>주변 찾기에서 우리 아이와 방문할 곳을 찾아보세요.</div>'}<footer>예시 업체의 자동 승인 예약이며 실제 업체의 승인·예약 전송은 이루어지지 않습니다.</footer>`}function cancelBooking(id){if(!confirm('예약을 취소할까요?'))return;let b=state.bookings.find(x=>x.id===id);b.status='예약 취소';b.due=null;save();render();toast('예약이 취소되었습니다.')}setInterval(()=>{let changed=false;state.bookings.forEach(b=>{if(b.status==='예약 승인 대기중'&&Date.now()>=b.due){b.status='예약 확정';changed=true;toast(`${pname(b.pet)} · ${facilities[b.fid].name} 예약 확정 | ${b.date} ${b.time}`);if($('#statusbtn')?.dataset.booking===b.id){$('#statusbtn').textContent=b.status;$('#statusinfo').textContent='예약이 확정되었습니다.'}}});if(changed){save();render()}},500);render();
</script></html>
